    <title>Majestics Sports Club</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            /*background: url('assets/images/SquashSportsClub.jpg') center center / cover no-repeat;*/
            height: 100vh;
            color: white;
        }

        .overlay {
            background: rgba(0, 0, 0, 0.6);
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            background: url(assets/images/SquashSportsClub.jpg) center center / cover
        }

        .overlay_last_match {
            background: rgba(0, 0, 0, 0.6);
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            background: url(assets/images/CAGE.jpg) center center / cover
        }

        .content {
            max-width: 700px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn-contacto {
            display: inline-block;
            padding: 15px 30px;
            font-size: 1rem;
            color: #0D111B;
            background-color: #FFD700;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-contacto:hover {
            background-color: #FFC300;
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
            }

            p {
                font-size: 1rem;
            }
        }


        .hero-video {
            width: 100%;
            background: #000;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 */
            overflow: hidden;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

    </style>
</head>
